<div class="registration-container">
  <h2>User Registration</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-group">
      <label>Email</label>
      <input formControlName="email" type="email" placeholder="Enter your email" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input formControlName="password" type="password" placeholder="Create a password" />
    </div>
    <div class="form-group">
      <label>Name</label>
      <input formControlName="name" type="text" placeholder="Full name" />
    </div>
    <div class="form-group">
      <label>Address</label>
      <input formControlName="address" type="text" placeholder="Address (optional)" />
    </div>
    <div class="form-group">
      <label>Phone</label>
      <input formControlName="phone" type="tel" placeholder="Phone (optional)" />
    </div>
    <div class="form-group">
      <label>Role</label>
      <select formControlName="role">
        <option value="Customer">Customer</option>
        <option value="Seller">Seller</option>
        <option value="Admin">Admin</option>
      </select>
    </div>
    <button type="submit" [disabled]="form.invalid">Register</button>
  </form>
  <div *ngIf="success" class="success-message">
    Registration successful!
  </div>
  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>
</div>
