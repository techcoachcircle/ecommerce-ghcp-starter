<h2>Order List</h2>
<table>
  <tr>
    <th>Order ID</th>
    <th>User ID</th>
    <th>Product ID</th>
    <th>Quantity</th>
    <th>Total Price</th>
    <th>Status</th>
  </tr>
  <tr *ngFor="let order of orders">
    <td>{{ order.id }}</td>
    <td>{{ order.userId }}</td>
    <td>{{ order.productId }}</td>
    <td>{{ order.quantity }}</td>
    <td>{{ order.totalPrice }}</td>
    <td>{{ order.status }}</td>
  </tr>
</table>
